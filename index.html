<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101725" />
    <meta name="description" content="Memorastle — a place for every memory." />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Memorastle — A place for every memory</title>
  </head>
  <body>
    <div class="app-shell">
      <main class="experience" aria-label="Memorastle 3D experience">
        <div id="scene-root" class="scene-root" aria-label="An interactive view inside a grand marble memory palace"></div>
        <div class="scene-shade" aria-hidden="true"></div>
        <header class="topbar">
          <a class="brand" href="/" aria-label="Memorastle home">
            <img src="/assets/favicon.png" alt="" width="38" height="38" />
            <span>Memorastle</span>
          </a>
          <div class="topbar-note"><span class="status-dot"></span> INTERACTIVE MEMORY PALACE</div>
          <div class="chapter-mark"><span>ATRIUM</span><span>01</span></div>
        </header>
        <section class="intro-panel" aria-labelledby="welcome-title">
          <p class="eyebrow"><span class="eyebrow-rule"></span> A PLACE FOR EVERY MEMORY</p>
          <h1 id="welcome-title">The Grand<br /><em>Archive</em></h1>
          <p class="welcome-copy">Wander through a world shaped for remembering. Give every idea a place of its own.</p>
        </section>
        <footer class="scene-footer"><span class="scene-caption">A PALACE BUILT IN THE MIND</span><span class="footer-rule"></span><span class="look-hint"><span aria-hidden="true">↔</span> DRAG TO LOOK AROUND</span></footer>
        <div id="loading-state" class="loading-state" role="status" aria-live="polite">
          <span class="loading-mark" aria-hidden="true"></span><span>Opening the archive</span>
        </div>
        <div id="app-error" class="app-error" role="alert" hidden></div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
